<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Active Runner — Hei Manaaki ngā Kaumātua</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>

/* ══════════════════════════════════════════════════════
   LOADING SCREEN
   ══════════════════════════════════════════════════════ */

#loader {
  position: fixed; inset: 0; z-index: 9000;
  background: #f4f7f2;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  transition: opacity 0.7s ease, visibility 0.7s ease;
}
#loader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

#loader-canvas {
  position: absolute; inset: 0;
  width: 100%; height: 100%; z-index: 0;
}

.loader-ground {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 90px; z-index: 1;
}
.loader-ground svg { width: 100%; height: 100%; }

.loader-logo {
  position: relative; z-index: 2;
  display: flex; flex-direction: column;
  align-items: center;
  margin-bottom: 44px;
  animation: loaderFadeIn 0.8s ease both;
}
@keyframes loaderFadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}

.runner-logo-wrap {
  position: relative;
  width: 220px; height: 160px;
  margin-bottom: 8px;
}
.runner-logo-wrap::after {
  content: '';
  position: absolute;
  bottom: 12px; left: 10px; right: 10px;
  height: 2px;
  background: linear-gradient(90deg, transparent, rgba(42,157,143,0.5), transparent);
  border-radius: 2px;
}
#runner-svg { width: 100%; height: 100%; overflow: visible; }

.runner-shadow {
  position: absolute;
  bottom: 14px; left: 50%;
  transform: translateX(-50%);
  width: 60px; height: 10px;
  background: radial-gradient(ellipse, rgba(42,157,143,0.35) 0%, transparent 70%);
  animation: shadowPulse 0.55s ease-in-out infinite alternate;
}
@keyframes shadowPulse {
  from { transform: translateX(-50%) scaleX(1);   opacity: 0.5; }
  to   { transform: translateX(-50%) scaleX(0.7); opacity: 0.3; }
}

.koru-badge {
  position: absolute;
  top: 6px; left: 50%;
  transform: translateX(-50%);
  width: 80px; height: 80px;
  opacity: 0.18;
  animation: koruSpin 12s linear infinite;
}
@keyframes koruSpin { to { transform: translateX(-50%) rotate(360deg); } }

.logo-title {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: 3rem; font-weight: 700;
  color: #0f2318; letter-spacing: 0.04em;
  line-height: 1; text-align: center;
}
.logo-title span { color: #E63946; }

.logo-sub {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  font-size: 0.88rem; letter-spacing: 0.3em;
  text-transform: uppercase; color: #2A9D8F;
  margin-top: 6px; text-align: center;
}

.loader-progress-wrap {
  position: relative; z-index: 2;
  width: min(320px, 72vw);
  display: flex; flex-direction: column;
  align-items: center; gap: 10px;
  animation: loaderFadeIn 0.8s ease 0.3s both;
}
.progress-track {
  width: 100%; height: 5px;
  background: rgba(241,250,238,0.08);
  border-radius: 10px; overflow: hidden;
}
.progress-fill {
  height: 100%; width: 0%;
  border-radius: 10px;
  background: linear-gradient(90deg, #2A9D8F, #3dbdad, #F4A261);
  background-size: 200%;
  animation: progressShimmer 1.5s linear infinite;
  transition: width 0.12s linear;
}
@keyframes progressShimmer {
  0%   { background-position: 0%; }
  100% { background-position: 200%; }
}
.progress-label {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  font-size: 0.9rem; letter-spacing: 0.1em;
  color: rgba(10,50,30,0.5); text-transform: uppercase;
}

/* Runner animation keyframes */
.runner-head { animation: headBob 0.55s ease-in-out infinite alternate; }
@keyframes headBob {
  from { transform: translateY(0); }
  to   { transform: translateY(-2px); }
}
.runner-torso { animation: bodyLean 0.55s ease-in-out infinite alternate; transform-origin: 50% 100%; }
@keyframes bodyLean {
  from { transform: rotate(-3deg); }
  to   { transform: rotate(2deg); }
}
.arm-f { animation: armF 0.55s ease-in-out infinite alternate; transform-origin: 50% 0%; }
.arm-b { animation: armB 0.55s ease-in-out infinite alternate; transform-origin: 50% 0%; }
@keyframes armF {
  from { transform: rotate(-35deg); }
  to   { transform: rotate(20deg); }
}
@keyframes armB {
  from { transform: rotate(20deg); }
  to   { transform: rotate(-35deg); }
}
.leg-f  { animation: legF 0.55s ease-in-out infinite alternate; transform-origin: 50% 0%; }
.leg-b  { animation: legB 0.55s ease-in-out infinite alternate; transform-origin: 50% 0%; }
@keyframes legF {
  from { transform: rotate(-40deg); }
  to   { transform: rotate(30deg); }
}
@keyframes legB {
  from { transform: rotate(30deg); }
  to   { transform: rotate(-40deg); }
}
.shin-f { animation: shinF 0.55s ease-in-out infinite alternate; transform-origin: 50% 0%; }
.shin-b { animation: shinB 0.55s ease-in-out infinite alternate; transform-origin: 50% 0%; }
@keyframes shinF {
  from { transform: rotate(10deg);  }
  to   { transform: rotate(-30deg); }
}
@keyframes shinB {
  from { transform: rotate(-30deg); }
  to   { transform: rotate(10deg);  }
}
.dust { animation: dustPuff 0.55s ease-out infinite; }
.dust:nth-child(2) { animation-delay: 0.18s; }
.dust:nth-child(3) { animation-delay: 0.36s; }
@keyframes dustPuff {
  0%   { transform: translateX(0)    scale(0.3); opacity: 0.5; }
  100% { transform: translateX(-28px) scale(1.4); opacity: 0; }
}

/* ── TOKENS ──────────────────────────────────────────── */
:root {
  --night:   #f4f7f2;
  --deep:    #ffffff;
  --red:     #C0392B;
  --red-v:   #E63946;
  --green:   #2A9D8F;
  --green-l: #3dbdad;
  --cream:   #0f2318;
  --earth:   #F4A261;
  --gold:    #d4a843;
  --glass:   rgba(255, 255, 255, 0.82);
  --glass-b: rgba(10,50,30,0.06);
  --radius:  22px;
  --dur:     0.28s;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

/* ── BODY & CANVAS BACKGROUND ─────────────────────────── */
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  font-size: 20px;
  line-height: 1.7;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--offwhite);
  color: var(--cream);
  overflow: hidden;
}

/* ── ANIMATED CANVAS BG ───────────────────────────────── */
#bg-canvas {
  position: fixed;
  inset: 0;
  width: 100%; height: 100%;
  z-index: 0;
}

/* ── FLOATING KORU SVGs ───────────────────────────────── */
.koru-ambient {
  position: fixed;
  pointer-events: none;
  z-index: 1;
  opacity: 0;
  animation: koruDrift 18s ease-in-out infinite;
}
.koru-ambient:nth-child(1) { top: 5%;  left: -60px;  width: 220px; animation-delay: 0s;   animation-duration: 20s; }
.koru-ambient:nth-child(2) { top: 50%; right: -50px; width: 180px; animation-delay: 4s;   animation-duration: 24s; transform-origin: right center; }
.koru-ambient:nth-child(3) { bottom: 5%; left: 5%;   width: 140px; animation-delay: 8s;   animation-duration: 18s; }
.koru-ambient:nth-child(4) { top: 8%;   right: 4%;   width: 100px; animation-delay: 12s;  animation-duration: 22s; }

@keyframes koruDrift {
  0%   { opacity: 0;    transform: translateY(10px) rotate(0deg); }
  15%  { opacity: 0.25; }
  50%  { opacity: 0.35; transform: translateY(-18px) rotate(8deg); }
  85%  { opacity: 0.25; }
  100% { opacity: 0;    transform: translateY(10px) rotate(0deg); }
}

/* ── TAPA TEXTURE OVERLAY ─────────────────────────────── */
body::after {
  content: '';
  position: fixed; inset: 0; z-index: 2; pointer-events: none;
  background-image:
    repeating-linear-gradient(0deg,   transparent, transparent 24px, rgba(42,157,143,0.06) 24px, rgba(42,157,143,0.06) 26px),
    repeating-linear-gradient(90deg,  transparent, transparent 24px, rgba(42,157,143,0.06) 24px, rgba(42,157,143,0.06) 26px);
}

/* ── MAIN CARD ────────────────────────────────────────── */
.card {
  position: relative; z-index: 10;
  width: min(92vw, 520px);
  max-height: 96vh;
  overflow-y: auto;
  background: var(--glass);
  backdrop-filter: blur(24px) saturate(1.4);
  -webkit-backdrop-filter: blur(24px) saturate(1.4);
  border: 1px solid rgba(42,157,143,0.18);
  border-radius: 32px;
  padding: 44px 40px 36px;
  box-shadow:
    0 0 0 1px rgba(42,157,143,0.12) inset,
    0 32px 80px rgba(42,157,143,0.1),
    0 0 120px rgba(42,157,143,0.08);
  animation: cardIn 1.6s cubic-bezier(.16,.8,.3,1) 0.5s both;
}

@keyframes cardIn {
  0%   { opacity: 0; transform: translateY(44px) scale(0.95); }
  60%  { opacity: 1; }
  100% { opacity: 1; transform: translateY(0)    scale(1); }
}

/* ── KOWHAIWHAI TOP ACCENT ────────────────────────────── */
.card-top-border {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 6px;
  border-radius: 32px 32px 0 0;
  overflow: hidden;
}
.card-top-border svg { width: 100%; height: 100%; }

/* ── KORU CORNER (unfurling) ──────────────────────────── */
.koru-corner {
  position: absolute;
  top: 14px; right: 20px;
  width: 52px; height: 52px;
  opacity: 0.6;
}
.koru-corner path {
  stroke: var(--green-l);
  stroke-width: 3.5;
  fill: none;
  stroke-linecap: round;
  stroke-dasharray: 220;
  stroke-dashoffset: 220;
  animation: drawKoru 2.2s cubic-bezier(.4,0,.2,1) 0.8s forwards;
}
.koru-corner .stem {
  stroke-dasharray: 40;
  stroke-dashoffset: 40;
  animation: drawKoru 0.6s ease 2.9s forwards;
}
@keyframes drawKoru { to { stroke-dashoffset: 0; } }

/* ── HEADER TEXT ──────────────────────────────────────── */
.eyebrow {
  font-size: 0.84rem;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--green-l);
  font-weight: 600;
  margin-bottom: 10px;
  animation: fadeUp 0.9s ease 1.3s both;
}

.main-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(2.8rem, 6vw, 3.8rem);
  font-weight: 700;
  line-height: 1.0;
  color: var(--cream);
  margin-bottom: 6px;
  animation: fadeUp 0.9s ease 1.5s both;
}
.main-title em {
  font-style: normal;
  color: var(--red-v);
}

.subtitle {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 1.22rem;
  color: var(--green-l);
  margin-bottom: 18px;
  animation: fadeUp 0.9s ease 1.65s both;
}

.whakatauki {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 1.08rem;
  color: rgba(10,50,30,0.7);
  border-left: 2px solid rgba(192,57,43,0.45);
  padding-left: 14px;
  margin-bottom: 30px;
  line-height: 1.55;
  animation: fadeUp 0.9s ease 1.8s both;
}
.whakatauki strong {
  display: block;
  font-style: normal;
  color: rgba(10,50,30,0.5);
  font-size: 0.95rem;
  letter-spacing: 0.04em;
  margin-top: 3px;
}

/* ── DIVIDER ──────────────────────────────────────────── */
.divider {
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(42,157,143,0.5), transparent);
  margin-bottom: 26px;
  animation: fadeUp 0.9s ease 1.95s both;
}

/* ── NAME INPUT ───────────────────────────────────────── */
.field-group {
  margin-bottom: 20px;
  animation: fadeUp 0.9s ease 2.05s both;
}
.field-label {
  display: block;
  font-size: 0.95rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: rgba(10,50,30,0.6);
  margin-bottom: 10px;
}

.input-wrap {
  position: relative;
}

.name-input {
  width: 100%;
  padding: 18px 54px 18px 20px;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  font-size: 1.25rem;
  font-weight: 500;
  color: #0f2318;
  background: rgba(255,255,255,0.9);
  border: 1.5px solid rgba(42,157,143,0.3);
  border-radius: 14px;
  outline: none;
  transition: border-color var(--dur), box-shadow var(--dur), background var(--dur);
  caret-color: var(--green-l);
}
.name-input::placeholder { color: rgba(10,50,30,0.35); }
.name-input:focus {
  border-color: rgba(42,157,143,0.7);
  background: #ffffff;
  box-shadow: 0 0 0 3px rgba(42,157,143,0.15);
}

.input-check {
  position: absolute;
  right: 18px; top: 50%;
  transform: translateY(-50%);
  font-size: 1.22rem;
  color: var(--green-l);
  opacity: 0;
  transition: opacity var(--dur);
}
.input-check.show { opacity: 1; }

/* ── LANGUAGE BUTTONS ─────────────────────────────────── */
.lang-group {
  margin-bottom: 24px;
  animation: fadeUp 0.9s ease 2.2s both;
}
.lang-label {
  font-size: 0.95rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: rgba(10,50,30,0.6);
  margin-bottom: 10px;
  display: block;
}
.lang-pills {
  display: flex;
  gap: 10px;
}
.lang-pill {
  flex: 1;
  padding: 13px 10px;
  border-radius: 50px;
  border: 1.5px solid rgba(241,250,238,0.15);
  background: rgba(241,250,238,0.04);
  color: rgba(10,50,30,0.7);
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  font-size: 1.08rem;
  font-weight: 600;
  cursor: pointer;
  transition: all var(--dur);
  text-align: center;
  letter-spacing: 0.02em;
  min-height: 54px;
}
.lang-pill:hover {
  border-color: rgba(42,157,143,0.5);
  color: #0f2318;
  background: rgba(42,157,143,0.1);
}
.lang-pill.active {
  border-color: var(--green);
  background: rgba(42,157,143,0.18);
  color: #0f2318;
  box-shadow: 0 0 0 3px rgba(42,157,143,0.12), 0 4px 20px rgba(42,157,143,0.2);
}
.lang-pill:focus-visible {
  outline: 3px solid var(--green-l);
  outline-offset: 3px;
}

/* ── BEGIN BUTTON ─────────────────────────────────────── */
.begin-btn {
  width: 100%;
  padding: 20px 28px;
  border-radius: 14px;
  border: none;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  font-size: 1.25rem;
  font-weight: 700;
  cursor: not-allowed;
  letter-spacing: 0.04em;
  background: rgba(10,50,30,0.07);
  color: rgba(10,50,30,0.3);
  transition: all var(--dur);
  min-height: 64px;
  position: relative;
  overflow: hidden;
  animation: fadeUp 0.9s ease 2.35s both;
}
.begin-btn::before {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, transparent 60%);
  opacity: 0; transition: opacity var(--dur);
}
.begin-btn.active {
  background: linear-gradient(135deg, #1e7a6e 0%, var(--green) 50%, #2ab8a8 100%);
  color: #fff;
  cursor: pointer;
  box-shadow: 0 8px 32px rgba(42,157,143,0.4), 0 2px 8px rgba(0,0,0,0.3);
  transform: none;
}
.begin-btn.active:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 40px rgba(42,157,143,0.5), 0 4px 12px rgba(0,0,0,0.3);
}
.begin-btn.active:hover::before { opacity: 1; }
.begin-btn.active:active { transform: translateY(0); }
.begin-btn:focus-visible {
  outline: 3px solid var(--green-l);
  outline-offset: 3px;
}

/* ── HEALTH FACT ──────────────────────────────────────── */
.health-fact {
  margin-top: 20px;
  text-align: center;
  font-size: 0.95rem;
  color: rgba(10,50,30,0.5);
  min-height: 22px;
  transition: opacity 0.5s;
  letter-spacing: 0.02em;
  animation: fadeUp 0.9s ease 2.5s both;
}
.health-fact i { color: var(--earth); margin-right: 6px; }

/* ── WELCOME OVERLAY ──────────────────────────────────── */
#welcome-overlay {
  display: none;
  position: fixed; inset: 0; z-index: 200;
  background: rgba(8,12,18,0.88);
  align-items: center; justify-content: center;
  backdrop-filter: blur(10px);
}
#welcome-overlay.show { display: flex; }

.welcome-box {
  background: linear-gradient(145deg, #e8f4ef, #d8eee8);
  border: 2px solid var(--green);
  border-radius: 28px;
  padding: 52px 52px 44px;
  max-width: 440px;
  width: 90vw;
  text-align: center;
  animation: scaleIn 0.4s cubic-bezier(.2,.8,.3,1) both;
  box-shadow: 0 0 80px rgba(42,157,143,0.25);
}
@keyframes scaleIn {
  from { transform: scale(0.88); opacity: 0; }
  to   { transform: scale(1);    opacity: 1; }
}
.welcome-koru {
  font-size: 3rem; margin-bottom: 16px;
  display: inline-block;
  animation: spin360 1.4s cubic-bezier(.2,.8,.3,1) both;
}
@keyframes spin360 {
  from { transform: rotate(-180deg) scale(0.5); opacity: 0; }
  to   { transform: rotate(0deg)    scale(1);   opacity: 1; }
}
.welcome-box h2 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.8rem; font-weight: 700;
  color: var(--green-l); margin-bottom: 8px;
}
.welcome-box .welcome-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 2.6rem; font-weight: 700;
  color: var(--cream); margin-bottom: 18px; line-height: 1.1;
}
.welcome-box p {
  color: rgba(10,50,30,0.65); font-size: 1.1rem; margin-bottom: 28px;
}
.welcome-spinner {
  width: 40px; height: 40px; margin: 0 auto 24px;
  border: 3px solid rgba(42,157,143,0.2);
  border-top-color: var(--green);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.welcome-back {
  background: rgba(42,157,143,0.12);
  border: 1px solid rgba(42,157,143,0.3);
  border-radius: 50px; color: #0f2318;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  font-size: 1.05rem; font-weight: 600;
  padding: 12px 28px; cursor: pointer;
  transition: background var(--dur);
}
.welcome-back:hover { background: rgba(42,157,143,0.22); }

/* ── UTILITIES ────────────────────────────────────────── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(22px); }
  to   { opacity: 1; transform: translateY(0); }
}

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--offwhite); }
::-webkit-scrollbar-thumb { background: rgba(42,157,143,0.35); border-radius: 3px; }

/* ── RESPONSIVE ───────────────────────────────────────── */
@media (max-width: 480px) {
  .card { padding: 36px 26px 28px; }
  .main-title { font-size: 2.4rem; }
  .welcome-box { padding: 36px 28px 32px; }
}


/* ── IN-CARD RUNNER ───────────────────────────────────── */
.card-runner-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-bottom: 10px;
  animation: fadeUp 0.9s ease 1.1s both;
}
.card-runner-svg-wrap {
  position: relative;
  width: 160px;
  height: 120px;
}
.card-runner-svg-wrap::after {
  content: '';
  position: absolute;
  bottom: 10px; left: 8px; right: 8px;
  height: 2px;
  background: linear-gradient(90deg, transparent, rgba(42,157,143,0.45), transparent);
  border-radius: 2px;
}
.card-runner-shadow {
  position: absolute;
  bottom: 12px; left: 50%;
  transform: translateX(-50%);
  width: 44px; height: 7px;
  background: radial-gradient(ellipse, rgba(42,157,143,0.3) 0%, transparent 70%);
  animation: shadowPulse 0.55s ease-in-out infinite alternate;
}
.card-runner-koru {
  position: absolute;
  top: 2px; left: 50%;
  transform: translateX(-50%);
  width: 60px; height: 60px;
  opacity: 0.12;
  animation: koruSpin 12s linear infinite;
}
#card-runner-svg { width: 100%; height: 100%; overflow: visible; }
</style>
</head>
<body>

<!-- ── CANVAS BACKGROUND ─────────────────────────────── -->
<canvas id="bg-canvas"></canvas>

<!-- ── AMBIENT KORU SHAPES ───────────────────────────── -->
<svg class="koru-ambient" viewBox="0 0 200 200" aria-hidden="true">
  <path fill="none" stroke="#2A9D8F" stroke-width="3" stroke-linecap="round"
    d="M100 160 C100 160 100 130 100 115 C100 75 70 52 50 62 C30 72 26 100 36 118 C46 136 68 143 88 133 C108 123 115 100 105 83 C95 66 77 62 65 72 C53 82 53 100 63 110 C73 120 89 117 95 108"/>

    <button class="welcome-back" onclick="closeOverlay()">
      <i class="fas fa-arrow-left"></i>&nbsp; Go back
    </button>
  </div>

<script>
/* ─── CANVAS ANIMATED BACKGROUND ────────────────────── */
(function() {
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  let W, H, lines, particles;

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
    init();
  }

  function init() {
    // Kowhaiwhai flowing lines
    lines = Array.from({ length: 18 }, (_, i) => ({
      y:    (H / 18) * i + Math.random() * 30,
      x:    Math.random() * W,
      amp:  10 + Math.random() * 22,
      freq: 0.004 + Math.random() * 0.006,
      spd:  0.18 + Math.random() * 0.3,
      col:  ['rgba(42,157,143,', 'rgba(192,57,43,', 'rgba(244,162,97,'][i % 3],
      op:   0.04 + Math.random() * 0.06
    }));

    // Floating particles (like running sparks)
    particles = Array.from({ length: 55 }, () => ({
      x:   Math.random() * W,
      y:   Math.random() * H,
      r:   0.5 + Math.random() * 1.5,
      vx:  0.3 + Math.random() * 0.8,
      vy: -0.1 - Math.random() * 0.3,
      op:  0.1 + Math.random() * 0.25,
      col: ['rgba(42,157,143,', 'rgba(212,168,67,', 'rgba(241,250,238,'][Math.floor(Math.random()*3)]
    }));
  }

  let t = 0;
  function draw() {
    ctx.clearRect(0, 0, W, H);

    // Base gradient
    const grad = ctx.createRadialGradient(W*0.35, H*0.45, 0, W*0.5, H*0.5, W*0.85);
    grad.addColorStop(0,   '#e8f4ef');
    grad.addColorStop(0.4, '#d4ede7');
    grad.addColorStop(1,   '#c5e4dc');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Flowing wave lines (kōwhaiwhai motion)
    lines.forEach(l => {
      ctx.beginPath();
      for (let x = 0; x <= W; x += 3) {
        const y = l.y + Math.sin((x + l.x) * l.freq) * l.amp;
        x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.strokeStyle = l.col + (l.op * 2.5) + ')';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      l.x += l.spd;
      if (l.x > W) l.x = 0;
    });

    // Runner particles
    particles.forEach(p => {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = p.col + (p.op * 2.5) + ')';
      ctx.fill();
      p.x += p.vx; p.y += p.vy;
      if (p.x > W) p.x = 0;
      if (p.y < 0)  p.y = H;
    });

    // Large background koru spirals (very faint)
    drawBgKoru(W * 0.08, H * 0.18, 90,  'rgba(42,157,143,0.12)');
    drawBgKoru(W * 0.92, H * 0.75, 70,  'rgba(192,57,43,0.1)');
    drawBgKoru(W * 0.5,  H * 0.88, 55,  'rgba(244,162,97,0.1)');

    t++;
    requestAnimationFrame(draw);
  }

  function drawBgKoru(cx, cy, scale, color) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(t * 0.002);
    ctx.beginPath();
    // simplified koru spiral
    for (let a = 0; a < Math.PI * 4; a += 0.05) {
      const r = (a / (Math.PI * 4)) * scale;
      const x = Math.cos(a) * r;
      const y = Math.sin(a) * r;
      a < 0.05 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.strokeStyle = color;
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.restore();
  }

  window.addEventListener('resize', resize);
  resize();
  draw();
})();

/* ─── COPY MAPS ──────────────────────────────────────── */
const copy = {
  en: {
    eyebrow:    'Active Runner',
    subtitle:   'To Care for Our Elders',
    whak:       '"Be strong, be brave, be steadfast"',
    whakTrans:  'Move well, live well, stand tall.',
    nameLabel:  'Your name',
    langLabel:  'Language',
    btnEmpty:   'Let\'s begin',
    btnFilled:  name => ⁠ Let\'s begin, ${name}! ⁠,
    greeting:   name => ⁠ Welcome, ${name}! ⁠,
    overlayMsg: 'Your camera is starting.<br>Stand back so your full body is visible.',
    factPrefix: 'Did you know? '
  },
  mi: {
    eyebrow:    'Takahi — The Running Game',
    subtitle:   'Hei Manaaki ngā Kaumātua',
    whak:       '"Whāia te iti kahurangi"',
    whakTrans:  'Strive for that which is most precious.',
    nameLabel:  'Tō ingoa',
    langLabel:  'Reo',
    btnEmpty:   'Tīmata',
    btnFilled:  name => ⁠ Tīmata, ${name}! ⁠,
    greeting:   name => ⁠ Nau mai, ${name}! ⁠,
    overlayMsg: 'Kei te tīmata tō kāmera.<br>Tū māmā kia kitea ō tinana katoa.',
    factPrefix: 'E mōhio ana koe? '
  }
};

const facts = {
  en: [
    'Moving daily improves balance and reduces fall risk.',
    'Exercise boosts memory — stay sharp, stay strong!',
    'Just 10 minutes of movement lifts your mood for hours.',
    'Strong legs keep you independent and confident.',
    'Deep breathing while moving strengthens your lungs.',
    'Regular movement helps manage blood pressure naturally.'
  ],
  mi: [
    'Ko te neke ia rā, ia rā e whakapakari ana i tō tūāhu.',
    'Ko te kori tinana e āwhina ana i te mahara.',
    'E waru meneti noa iho e pai ana ki tō ngākau.',
    'Ko ngā waewae kaha e manaaki ana i tō rangatiratanga.',
    'Ko te manawa hōhonu e kaha ana i tō pūkahukahu.',
    'Ko te kori ōrite e āwhina ana ki te toto.'
  ]
};

let currentLang = 'en';
let factIndex   = 0;
let factTimer   = null;

function setLang(lang) {
  currentLang = lang;

  // toggle pills
  document.getElementById('lang-en').classList.toggle('active', lang === 'en');
  document.getElementById('lang-mi').classList.toggle('active', lang === 'mi');
  document.getElementById('lang-en').setAttribute('aria-pressed', lang === 'en');
  document.getElementById('lang-mi').setAttribute('aria-pressed', lang === 'mi');

  const c = copy[lang];
  document.getElementById('eyebrow-text').textContent  = c.eyebrow;
  document.getElementById('subtitle-text').textContent = c.subtitle;
  document.getElementById('whakatauki-text').firstChild.textContent = c.whak + '\n';
  document.getElementById('whakatauki-trans').textContent = c.whakTrans;
  document.getElementById('name-label').textContent    = c.nameLabel;
  document.getElementById('lang-label').textContent    = c.langLabel;
  updateBtn();
  startFacts();
}

function updateBtn() {
  const name = document.getElementById('name-input').value.trim();
  const btn  = document.getElementById('begin-btn');
  const c    = copy[currentLang];
  if (name.length >= 2) {
    btn.textContent = c.btnFilled(name);
    btn.classList.add('active');
    btn.disabled = false;
  } else {
    btn.textContent = c.btnEmpty;
    btn.classList.remove('active');
    btn.disabled = true;
  }
}

// Name input listeners
document.getElementById('name-input').addEventListener('input', function() {
  const val = this.value.trim();
  const chk = document.getElementById('input-check');
  chk.classList.toggle('show', val.length >= 2);
  updateBtn();
});

document.getElementById('name-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    const btn = document.getElementById('begin-btn');
    if (!btn.disabled) beginGame();
  }
});

// Health facts ticker
function startFacts() {
  clearInterval(factTimer);
  showFact();
  factTimer = setInterval(showFact, 5000);
}

function showFact() {
  const el   = document.getElementById('fact-text');
  const list = facts[currentLang];
  const c    = copy[currentLang];
  el.style.opacity = 0;
  setTimeout(() => {
    el.textContent   = c.factPrefix + list[factIndex % list.length];
    el.style.opacity = 1;
    factIndex++;
  }, 300);
}

// Begin game
function beginGame() {
  const name = document.getElementById('name-input').value.trim();
  if (name.length < 2) return;
  const c = copy[currentLang];
  console.log('[Active Elders] Starting game —', { name, language: currentLang });
  document.getElementById('overlay-name').textContent = c.greeting(name);
  document.getElementById('overlay-msg').innerHTML    = c.overlayMsg;
  const ov = document.getElementById('welcome-overlay');
  ov.classList.add('show');
  document.querySelector('.welcome-back').focus();
  /* TODO: initialise MediaPipe / game canvas here */
}

function closeOverlay() {
  document.getElementById('welcome-overlay').classList.remove('show');
  document.getElementById('name-input').focus();
}

// Keyboard: Escape closes overlay
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeOverlay();
});
// Click outside box
document.getElementById('welcome-overlay').addEventListener('click', function(e) {
  if (e.target === this) closeOverlay();
});

// Boot
setLang('en');
</script>
